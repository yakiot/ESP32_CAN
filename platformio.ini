[platformio]
default_envs = heavy_duty_j1939

[env]
platform = espressif32
board = esp32dev
framework = arduino
build_flags = 
	-DCORE_DEBUG_LEVEL=4  
; 4 = Debug, 3 = Info, 0 = None
; lib_compat_mode = strict

monitor_filters = time, colorize
; monitor_port = /dev/cu.usbserial-A5069RR4
monitor_speed = 115200
; monitor_rts = 0
; monitor_dtr = 0

; upload_port = /dev/cu.wchusbserial110

lib_deps = 
	ESP32-TWAI-CAN
	; h2zero/NimBLE-Arduino
	; eric-wieser/nanopb-arduino@^1.1.0
	
; PlatformIO will attempt to auto-detect the port. If it fails, or you
; have multiple devices, you can specify it manually.
; Examples: /dev/tty.usbserial-0001 (macOS), /dev/ttyUSB0 (Linux), COM3 (Windows)
; upload_port = /dev/tty.wchusbserial10

[env:heavy_duty_j1939]
build_flags =
    ${env.build_flags}
    -DPROTOCOL_J1939

[env:passenger_obd2]
build_flags =
    ${env.build_flags}
    -DPROTOCOL_OBD2


